name: Publish
on:
  push:
    branches: [release]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run ci:local
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already published; skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: benchmark-hundred-step
      - name: Publish to ants.land
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version --registry https://npm.ants.land >/dev/null 2>&1; then
            echo "$NAME@$VER on ants.land; skipping."
          else
            npm publish --access public --registry https://npm.ants.land
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ANTS_TOKEN }}
